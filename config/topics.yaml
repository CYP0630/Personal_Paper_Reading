schema_version: 1

profile:
  id: personal_ai_research
  name: Personal AI Research Radar
  description: >-
    A multi-label research profile centered on agentic systems, post-training,
    multimodal intelligence, and agentic applications in finance and medicine.
  timezone: America/New_York

retrieval_policy:
  # Keep the daily reading load bounded even when the candidate pool is large.
  daily:
    lookback_days: 4
    candidate_pool_size: 300
    digest_size: 8
  weekly:
    lookback_days: 10
    digest_size: 20

  # These lanes are evaluated independently before candidates are deduplicated.
  discovery_mix:
    core_fit: 0.65
    cross_topic: 0.20
    frontier_watch: 0.15

  scoring:
    # Fit and heat remain separate in reports so popularity cannot hide relevance.
    fit:
      semantic_similarity: 0.40
      keyword_and_topic_match: 0.25
      positive_seed_similarity: 0.20
      project_relevance: 0.15
    heat:
      source_consensus: 0.30
      age_normalized_attention: 0.30
      citation_velocity: 0.20
      code_or_model_velocity: 0.20
    confidence:
      metadata_completeness: 0.25
      full_text_availability: 0.25
      evidence_quality: 0.30
      reproducibility_signals: 0.20

  selection:
    minimum_fit: 0.55
    preferred_fit: 0.72
    maximum_per_primary_topic: 3
    minimum_cross_topic_items: 1
    minimum_frontier_items: 1

  deduplication:
    identifier_order:
      - doi
      - arxiv_id
      - semantic_scholar_id
      - openalex_id
      - normalized_title
    normalized_title_similarity_threshold: 0.94

  required_metadata:
    - title
    - abstract
    - published_at
    - primary_url

source_groups:
  scholarly_search:
    - id: arxiv
      enabled: true
      weight: 1.00
    - id: openreview
      enabled: true
      weight: 1.00
    - id: openalex
      enabled: false
      planned: v2
      weight: 0.90
    - id: semantic_scholar
      enabled: false
      planned: v2
      weight: 0.95
  trend_detection:
    - id: huggingface_papers
      enabled: true
      weight: 0.85
    - id: github
      enabled: false
      planned: v2
      weight: 0.70
  domain_sources:
    - id: pubmed
      enabled: true
      topics:
        - agentic_medicine
    - id: ncbi_pmc
      enabled: false
      planned: v2
      topics:
        - agentic_medicine
  journal_watch:
    # High-priority direct monitoring for medical AI. Retrieval should happen
    # before general scholarly search, followed by the agentic_medicine filter.
    - id: nature
      name: Nature
      enabled: true
      priority: high
      articles_url: https://www.nature.com/nature/articles
      feed_url: https://www.nature.com/nature.rss
      topics:
        - agentic_medicine
      score_boost: 0.18
    - id: nature_medicine
      name: Nature Medicine
      enabled: true
      priority: critical
      articles_url: https://www.nature.com/nm/articles
      feeds_url: https://www.nature.com/nm/web-feeds
      feed_url: https://www.nature.com/nm.rss
      topics:
        - agentic_medicine
      score_boost: 0.25
    - id: nature_machine_intelligence
      name: Nature Machine Intelligence
      enabled: true
      priority: high
      articles_url: https://www.nature.com/natmachintell/articles
      feed_url: https://www.nature.com/natmachintell.rss
      topics:
        - agentic_medicine
      score_boost: 0.20

query_defaults:
  # Broad terms must co-occur with at least one AI-context term when a topic
  # declares require_ai_context: true.
  ai_context_terms:
    - foundation model
    - large language model
    - language model
    - LLM
    - multimodal large language model
    - MLLM
    - vision-language model
    - VLM
    - reinforcement learning
    - generative AI
    - neural model
    - agentic AI
  languages:
    - en
  publication_types:
    - preprint
    - conference
    - journal
    - technical_report
  global_exclude_terms:
    - withdrawn
    - retracted

delivery:
  hermes:
    enabled: true
    executable: hermes
    platform: discord
    server_id: "1526970527149854740"
    channel_id: "1542379320289263676"
    target: "discord:1542379320289263676"
    subject: "📚 Daily Paper Radar"

